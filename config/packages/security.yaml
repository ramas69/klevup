security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: login
                check_path: login
                success_handler: App\Security\LoginSuccessHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: logout
                target: home
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_APPORTEUR }
        - { path: ^/support, roles: ROLE_CLIENT }

when@test:
    security:
        firewalls:
            main:
                # Throttling state is cached between runs; keep it out of the way of functional tests.
                login_throttling:
                    max_attempts: 10000
